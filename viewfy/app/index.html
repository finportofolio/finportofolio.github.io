*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--card:#fff;--g:#5ED21C;--gd:#1f5d12;--gl:#e9f9df;--ink:#111411;--bg:#f1f5ee;--line:#e4eadf;--mut:#7c8778;--red:#ef4444}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:#dfe7da;color:var(--ink);display:flex;justify-content:center;min-height:100vh}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
button:active{transform:scale(.96)}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{width:100%;max-width:430px;min-height:100vh;background:var(--bg);padding-bottom:130px;overflow-x:hidden}
main{padding:18px 18px 0}
main.in>*{animation:up .45s cubic-bezier(.2,.8,.2,1) both}
main.in>*:nth-child(2){animation-delay:.05s}main.in>*:nth-child(3){animation-delay:.1s}main.in>*:nth-child(4){animation-delay:.15s}main.in>*:nth-child(n+5){animation-delay:.2s}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes sh{from{transform:translateY(100%)}to{transform:none}}
/* flat 2D icons: tinted tile + colored line icon; real brand logos on brand color */
.ic{--c:#5ED21C;width:44px;height:44px;border-radius:13px;flex:none;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;
 color:var(--c);background:color-mix(in srgb,var(--c) 13%,var(--card))}

.sel span{display:flex;align-items:center;gap:10px}.sel svg.i{width:18px;height:18px}
.camp{padding:0;overflow:hidden}

.cb{padding:14px 16px 16px}
.bars{display:flex;align-items:flex-end;gap:8px;height:110px;margin-top:12px}
.bc{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px}
.bc i{width:100%;height:0;border-radius:8px;background:var(--gl);transition:height .8s cubic-bezier(.2,.8,.2,1)}
.bc.on i{background:repeating-linear-gradient(135deg,var(--g) 0 5px,#8be356 5px 9px)}
.go .bc i{height:var(--h)}.bc span{font-size:11px;color:var(--mut);font-weight:600}
svg.ln{width:100%;height:120px;display:block;margin-top:8px}
svg.ln .l{fill:none;stroke:var(--g);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.2s .15s ease-out forwards}

label{display:block;font-size:12px;font-weight:700;color:var(--mut);margin:12px 0 6px}
input[type=text],input[type=number],select{width:100%;background:var(--bg);border:1.5px solid transparent;padding:13px 14px;border-radius:14px;font:600 16px 'Plus Jakarta Sans',system-ui,sans-serif;color:var(--ink);outline:0}

input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:8px;border-radius:6px;outline:0;margin:10px 0 4px;background:linear-gradient(90deg,var(--g) var(--p,5%),var(--line) var(--p,5%))}

.qb{display:flex;gap:8px;margin-top:10px}.qb button{flex:1;background:var(--bg);padding:9px 0;border-radius:12px;font-weight:700;font-size:12px}.qb button.on{background:var(--ink);color:#fff}

.atc.on{border-color:var(--g);background:var(--gl)}.atc b{display:flex;justify-content:space-between;font-size:13px}.atc b em{font-style:normal;color:var(--gd);font-size:11px}.atc span{font-size:11.5px;color:var(--mut);display:block;margin-top:3px;line-height:1.3}

.psum{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.psum div{background:var(--gl);border-radius:14px;padding:12px;text-align:center}.psum b{display:block;font-size:20px;font-weight:800;color:var(--gd)}.psum small{font-size:11px;color:var(--gd)}
.tl{height:72px!important}.tl .lb{position:absolute;bottom:20px;transform:translateX(-50%);background:var(--g);color:var(--ink);font-size:10px;font-weight:800;padding:2px 6px;border-radius:6px;white-space:nowrap;z-index:2}

.ck{list-style:none;margin-top:10px}.ck li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px;font-weight:600}.ck li:last-child{border:0}.ck li span.f{flex:1}.ck li em{font-style:normal;font-size:12px;color:var(--mut)}

.opt.on{border-color:var(--g);background:var(--gl)}
.opt b{display:block;font-size:16px;margin-bottom:2px}
.pick{display:flex;flex-wrap:wrap;gap:9px}
.pick button{background:var(--card);padding:11px 15px;border-radius:16px;font-weight:700;font-size:13px;border:2px solid transparent;box-shadow:0 2px 8px #0000000a}
.pick button.on{border-color:var(--g);background:var(--gl)}
body.dark{--bg:#10150e;--card:#1a2117;--ink:#eef3ea;--line:#2a3326;--gl:#1e3613;--mut:#98a393;--gd:#8fe35a;background:#070a06}
body.dark .rb::after{border-color:var(--card)}body.dark select,body.dark input{color:var(--ink)}
.btn{color:var(--bg)}.btn.g{color:#111411}.btn.l{color:var(--gd)}.chip.on{color:var(--bg)}
.aud .ab{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12px;font-weight:700}.aud .ab span:first-child{width:46px;color:var(--mut)}.aud .ab .bar{flex:1;margin:0}.aud .ab span:last-child{width:36px;text-align:right}
.gd2{display:flex;height:12px;border-radius:7px;overflow:hidden;margin-top:8px}.gd2 i{display:block;height:100%}
.tgb{background:#e7f3ff;border-radius:14px 14px 14px 4px;padding:10px 12px;font-size:13px;line-height:1.45;color:#0f172a;white-space:pre-wrap;word-break:break-word;box-shadow:0 1px 1px #0001}
.tgw{background:linear-gradient(135deg,#a7c7a0,#7da37a);border-radius:16px;padding:14px;margin-top:10px}
.tgw .ch{display:flex;align-items:center;gap:8px;color:#fff;font-weight:800;font-size:12px;margin-bottom:8px}
.tgw .vw{font-size:10px;color:#64748b;text-align:right;margin-top:4px}
textarea{width:100%;background:var(--bg);border:1.5px solid transparent;padding:13px 14px;border-radius:14px;font:600 16px 'Plus Jakarta Sans',system-ui,sans-serif;color:var(--ink);outline:0;resize:vertical}
textarea:focus{border-color:var(--g)}
@media(min-width:700px){.app{box-shadow:0 0 50px #0002}}

/* ===== responsive: all phone sizes ===== */
input,textarea,select{font-family:inherit;font-size:16px}
.plist,.g2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.pb{min-width:0;word-break:break-word}
.qb{flex-wrap:wrap}
.top .t{min-width:0;flex:1}.top .t small,.top .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat small{display:block;padding-right:46px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
nav{bottom:calc(14px + env(safe-area-inset-bottom));max-width:calc(100% - 20px)}
.app{padding-bottom:calc(120px + env(safe-area-inset-bottom))}
@media(max-width:374px){
 main{padding:14px 12px 0}
 h1{font-size:22px!important}
 nav{gap:2px;padding:5px}
 nav button{height:42px;min-width:42px;padding:0 10px;font-size:11px}
 .btn{font-size:13px}
 .big{font-size:32px!important}
 .ic{width:40px;height:40px;border-radius:12px}
 .ic.sm{width:32px;height:32px;border-radius:10px}.ic.sm svg.i{width:17px;height:17px}
 .stat .ic{width:30px;height:30px;border-radius:9px}.stat .ic svg.i{width:16px;height:16px}
 .stat small{padding-right:34px}
 .stat .v{font-size:21px}
 .pb{padding:8px;gap:8px;font-size:12px}
}
@media(max-height:620px){.ic.lg{width:48px;height:48px}}

.rpr{display:flex;align-items:center;gap:10px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.rpc{display:flex;flex-wrap:wrap;gap:6px;flex:1;min-width:0}
.rpc span{display:flex;flex-direction:column;background:var(--bg);border-radius:10px;padding:5px 9px;min-width:0}
.rpc small{font-size:10px;color:var(--mut);font-weight:700}.rpc b{font-size:14px;color:var(--gd)}
.rtb{margin-top:8px;font-size:12px}
.rth,.rtr{display:grid;grid-template-columns:40px minmax(0,1fr) 62px 52px;gap:6px;align-items:center;padding:5px 0}
.rth{color:var(--mut);font-weight:700;font-size:10.5px;border-bottom:1px solid var(--line)}.rth span:nth-child(n+3){text-align:right}
.rtr b{text-align:right;font-size:13px}.rtr b.g{color:var(--gd)}.rta{font-weight:600}
.rtr .ic.sm{width:28px;height:28px;border-radius:8px}.rtr .ic.sm svg.i{width:15px;height:15px}
body.dark nav{background:#162313;box-shadow:0 14px 30px -10px #000;border:1px solid #2b3d26}body.dark nav button{color:#a9c79c}body.dark nav button.on{color:#0a0f09}
</style>
